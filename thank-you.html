<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | AdeCole Digital</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .thank-you-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .thank-you-container h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 20px;
    }

    .thank-you-container p {
      max-width: 550px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .return-home {
      display: inline-block;
      padding: 14px 28px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .return-home:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="thank-you-container">
    <h1>Thank You for Reaching Out!</h1>

    <p>
      Your consultation request has been received.
      Thank you for your interest in AdeCole Digital.
      We look forward to learning more about your
      business goals and exploring how we can help
      turn your digital marketing investment into
      measurable growth.
    </p>

    <a href="index.html" class="return-home">
      Return to Homepage
    </a>
  </main>
</body>
</html>
